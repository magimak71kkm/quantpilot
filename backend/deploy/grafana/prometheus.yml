global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: quantpilot-proxy
    metrics_path: /metrics
    static_configs:
      - targets: ["proxy:8080"]
        labels:
          service: quantpilot-proxy
          env: dev
