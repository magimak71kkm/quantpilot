{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-proxy
  labels:
    app.kubernetes.io/name: quantpilot
    {{- with .Values.monitoring.releaseLabel }}
    release: {{ . }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: quantpilot
      app.kubernetes.io/component: proxy
  namespaceSelector:
    matchNames: [{{ .Release.Namespace }}]
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.interval | default "15s" }}
      scrapeTimeout: {{ .Values.monitoring.scrapeTimeout | default "10s" }}
      honorLabels: true
{{- end }}
