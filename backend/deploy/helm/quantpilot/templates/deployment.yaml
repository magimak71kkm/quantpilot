apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-proxy
  labels:
    app.kubernetes.io/name: quantpilot
    app.kubernetes.io/component: proxy
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: quantpilot
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quantpilot
        app.kubernetes.io/component: proxy
      annotations:
        {{- if .Values.vault.enabled }}
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-core.env:   {{ .Values.vault.secrets.core   | quote }}
        vault.hashicorp.com/agent-inject-secret-google.env: {{ .Values.vault.secrets.google | quote }}
        vault.hashicorp.com/agent-inject-secret-gemini.env: {{ .Values.vault.secrets.gemini | quote }}
        vault.hashicorp.com/agent-inject-template-core.env: |
          {{`{{- with secret "secret/data/quantpilot/core" -}}
          QP_JWT_SECRET={{ .Data.data.jwt_secret }}
          QP_KMS_KEY_B64={{ .Data.data.kms_key_b64 }}
          QP_DATABASE_URL={{ .Data.data.database_url }}
          QP_REDIS_URL={{ .Data.data.redis_url }}
          {{- end }}`}}
        vault.hashicorp.com/agent-inject-template-google.env: |
          {{`{{- with secret "secret/data/quantpilot/google" -}}
          QP_GOOGLE_CLIENT_ID={{ .Data.data.client_id }}
          QP_GOOGLE_CLIENT_SECRET={{ .Data.data.client_secret }}
          QP_GOOGLE_SCOPES={{ .Data.data.scopes }}
          {{- end }}`}}
        vault.hashicorp.com/agent-inject-template-gemini.env: |
          {{`{{- with secret "secret/data/quantpilot/gemini" -}}
          QP_GEMINI_API_KEY={{ .Data.data.api_key }}
          QP_GEMINI_DAILY_QUOTA_PER_USER={{ .Data.data.daily_quota_per_user }}
          {{- end }}`}}
        {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}-proxy
      containers:
        - name: proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -a
              [ -f /vault/secrets/core.env ]   && . /vault/secrets/core.env
              [ -f /vault/secrets/google.env ] && . /vault/secrets/google.env
              [ -f /vault/secrets/gemini.env ] && . /vault/secrets/gemini.env
              set +a
              exec uvicorn app.main:app --host 0.0.0.0 --port 8080
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:  {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:     {{- toYaml . | nindent 8 }}
      {{- end }}
