apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-proxy
  labels:
    app.kubernetes.io/name: quantpilot
    app.kubernetes.io/component: proxy
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: quantpilot
    app.kubernetes.io/component: proxy
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-proxy
  labels:
    app.kubernetes.io/name: quantpilot
