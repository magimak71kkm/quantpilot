# Tracing 확장 스택 — Jaeger UI(16686) + OTel Collector(4317/4318)
#
# 실행:
#   docker compose \
#     -f docker-compose.yml \
#     -f otel/docker-compose.tracing.yml up -d
#
# proxy 컨테이너에 다음 env 를 추가하세요:
#   QP_OTEL_ENABLED=true
#   QP_OTEL_ENDPOINT=http://otel-collector:4317

version: "3.9"

services:
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: qp-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"    # UI
      - "14268:14268"    # jaeger.thrift
      - "4317"           # OTLP gRPC (internal)

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.107.0
    container_name: qp-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"      # OTLP gRPC (external)
      - "4318:4318"      # OTLP HTTP
    depends_on: [jaeger]
